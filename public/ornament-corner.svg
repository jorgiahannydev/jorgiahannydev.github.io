<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer L-frame (rose) -->
  <path d="M4,4 L116,4" stroke="#9a4060" stroke-width="1.4" stroke-opacity="0.55"/>
  <path d="M4,4 L4,116" stroke="#9a4060" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- Inner L-frame (gold) -->
  <path d="M9,9 L96,9" stroke="#c8903a" stroke-width="0.6" stroke-opacity="0.42"/>
  <path d="M9,9 L9,96" stroke="#c8903a" stroke-width="0.6" stroke-opacity="0.42"/>

  <!-- Corner rosette at (4,4)  6 petals + center -->
  <circle cx="4" cy="4" r="12" stroke="#9a4060" stroke-width="0.9" stroke-opacity="0.42"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24" transform="rotate(60 4 4)"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24" transform="rotate(120 4 4)"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24" transform="rotate(180 4 4)"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24" transform="rotate(240 4 4)"/>
  <ellipse cx="4" cy="-8" rx="3" ry="5.5" fill="#9a4060" fill-opacity="0.24" transform="rotate(300 4 4)"/>
  <circle cx="4" cy="4" r="4" fill="#c8903a" fill-opacity="0.55"/>
  <circle cx="4" cy="4" r="1.8" fill="#9a4060" fill-opacity="0.6"/>

  <!-- Wavy vine  horizontal arm -->
  <path d="M18,4 Q26,0 34,4 Q42,8 50,4 Q58,0 66,4 Q74,8 82,4 Q90,0 98,4 Q106,8 114,4"
        stroke="#c8903a" stroke-width="0.9" stroke-opacity="0.4"/>

  <!-- Wavy vine  vertical arm -->
  <path d="M4,18 Q0,26 4,34 Q8,42 4,50 Q0,58 4,66 Q8,74 4,82 Q0,90 4,98 Q8,106 4,114"
        stroke="#c8903a" stroke-width="0.9" stroke-opacity="0.4"/>

  <!-- Leaf pairs  horizontal arm (at 34, 66, 98) -->
  <path d="M34,4 Q29,-6 22,4" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M34,4 Q29,14 22,4" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>
  <path d="M66,4 Q61,-6 54,4" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M66,4 Q61,14 54,4" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>
  <path d="M98,4 Q93,-6 86,4" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M98,4 Q93,14 86,4" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>

  <!-- Leaf pairs  vertical arm (at 34, 66, 98) -->
  <path d="M4,34 Q-6,29 4,22" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M4,34 Q14,29 4,22" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>
  <path d="M4,66 Q-6,61 4,54" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M4,66 Q14,61 4,54" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>
  <path d="M4,98 Q-6,93 4,86" fill="#9a4060" fill-opacity="0.2" stroke="#9a4060" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M4,98 Q14,93 4,86" fill="#9a4060" fill-opacity="0.15" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.25"/>

  <!-- Small floral at mid horizontal (x=50) -->
  <circle cx="50" cy="4" r="5" stroke="#c8903a" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="50" cy="4" r="2" fill="#c8903a" fill-opacity="0.4"/>

  <!-- Small floral at mid vertical (y=50) -->
  <circle cx="4" cy="50" r="5" stroke="#c8903a" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="4" cy="50" r="2" fill="#c8903a" fill-opacity="0.4"/>

  <!-- Terminal diamonds -->
  <polygon points="116,4 120,1 120,7 116,4" fill="#c8903a" fill-opacity="0.52"/>
  <polygon points="4,116 1,120 7,120 4,116" fill="#c8903a" fill-opacity="0.52"/>
</svg>
