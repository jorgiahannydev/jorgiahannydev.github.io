<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 22" fill="none">
  <!-- Base line through center -->
  <path d="M0,11 L120,11" stroke="#c8903a" stroke-width="0.55" stroke-opacity="0.38"/>

  <!-- Repeating motif: leaf-diamond-leaf (period = 30px, starts at 15) -->

  <!-- x=15: upward leaf -->
  <path d="M15,11 Q10,4 5,11" fill="#9a4060" fill-opacity="0.18" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.28"/>
  <path d="M15,11 Q10,18 5,11" fill="#9a4060" fill-opacity="0.13" stroke="#9a4060" stroke-width="0.35" stroke-opacity="0.22"/>

  <!-- x=30: diamond -->
  <polygon points="30,8 33,11 30,14 27,11" fill="#c8903a" fill-opacity="0.38"/>

  <!-- x=45: leaf -->
  <path d="M45,11 Q40,4 35,11" fill="#9a4060" fill-opacity="0.18" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.28"/>
  <path d="M45,11 Q40,18 35,11" fill="#9a4060" fill-opacity="0.13" stroke="#9a4060" stroke-width="0.35" stroke-opacity="0.22"/>

  <!-- x=60: small circle ornament (center of tile) -->
  <circle cx="60" cy="11" r="4.5" stroke="#9a4060" stroke-width="0.6" stroke-opacity="0.4"/>
  <circle cx="60" cy="11" r="2"   fill="#c8903a"  fill-opacity="0.42"/>

  <!-- x=75: leaf -->
  <path d="M75,11 Q70,4 65,11" fill="#9a4060" fill-opacity="0.18" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.28"/>
  <path d="M75,11 Q70,18 65,11" fill="#9a4060" fill-opacity="0.13" stroke="#9a4060" stroke-width="0.35" stroke-opacity="0.22"/>

  <!-- x=90: diamond -->
  <polygon points="90,8 93,11 90,14 87,11" fill="#c8903a" fill-opacity="0.38"/>

  <!-- x=105: leaf -->
  <path d="M105,11 Q100,4 95,11" fill="#9a4060" fill-opacity="0.18" stroke="#9a4060" stroke-width="0.4" stroke-opacity="0.28"/>
  <path d="M105,11 Q100,18 95,11" fill="#9a4060" fill-opacity="0.13" stroke="#9a4060" stroke-width="0.35" stroke-opacity="0.22"/>
</svg>
